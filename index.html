<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漢字ゲーム β v6.1 試作版</title><style>
:root{font-family:system-ui,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#1a2834;background:#f5f7fa}body{margin:0}.shell{max-width:850px;margin:32px auto;padding:0 18px}h1{font-size:26px}p{line-height:1.7;color:#4e6171}.wrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}.panel{background:white;border:1px solid #dde4eb;border-radius:16px;padding:16px}#pad{width:100%;background:#fff;display:block;touch-action:none;cursor:crosshair;border:1px solid #bdc9d4;border-radius:12px;aspect-ratio:1}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,select{background:white;border:1px solid #bdc9d4;padding:9px 13px;border-radius:8px;font:inherit}button{cursor:pointer}button.primary{background:#1f5a91;color:white;border-color:#1f5a91}.result{font-size:21px;font-weight:700;margin:10px 0}.muted{font-size:12px;color:#6d7c88}.score{font-size:30px;font-weight:700}pre{overflow:auto;background:#f5f7fa;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap}#model{width:100%;max-width:220px;aspect-ratio:1}.good{color:#18703b}.bad{color:#b32828}.warn{color:#a36311}@media(max-width:650px){.wrap{grid-template-columns:1fr}.shell{margin:15px auto}h1{font-size:22px}}
</style></head><body><main class="shell"><h1>漢字ゲーム β v6.1 <small style="font-size:13px;color:#777">試作版</small></h1><p>必須構造を確認した後に、お手本との画像バランスを採点します。小さな隙間は全体の形が整っていれば許容します。</p><div class="toolbar"><label>出題文字 <select id="kanji"><option>末</option><option>未</option><option>土</option><option>士</option></select></label><button id="undo">1画戻す</button><button id="clear">消す</button><button class="primary" id="judge">採点する</button><button id="export" disabled>診断JSONを保存</button></div><div class="wrap"><section class="panel"><canvas id="pad" width="600" height="600" aria-label="漢字の手書き入力"></canvas><div class="muted">指またはマウスで一画ずつ書いてください。筆順判定は未実装です。</div></section><aside class="panel"><strong>お手本（配置の目安）</strong><canvas id="model" width="220" height="220"></canvas><div id="result" class="result">入力待ち</div><div id="score" class="score">—</div><p id="advice">5画で「末」を書きましょう。</p><details><summary>診断の詳細</summary><pre id="detail">—</pre></details></aside></div><p class="muted">この試作版のしきい値は調整中です。元のv6.0のソースは含んでいないため、互換機能のすべてを再現したものではありません。</p></main><script src="grading.js"></script><script>
(()=>{'use strict';const canvas=document.querySelector('#pad'),ctx=canvas.getContext('2d'),refCanvas=document.querySelector('#model'),rc=refCanvas.getContext('2d');let strokes=[],active=null,last=null;let target=document.querySelector('#kanji');function style(c){c.lineCap='round';c.lineJoin='round';c.strokeStyle='#183d61';c.lineWidth=5;}function draw(){ctx.clearRect(0,0,600,600);ctx.strokeStyle='#ecf0f4';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(300,0);ctx.lineTo(300,600);ctx.moveTo(0,300);ctx.lineTo(600,300);ctx.stroke();style(ctx);for(let st of [...strokes,...(active?[active]:[])]){if(!st.length)continue;ctx.beginPath();ctx.moveTo(st[0].x,st[0].y);for(let i=1;i<st.length;i++)ctx.lineTo(st[i].x,st[i].y);ctx.stroke();}}function model(){rc.clearRect(0,0,220,220);rc.strokeStyle='#e5e7eb';rc.lineWidth=1;rc.strokeRect(20,20,180,180);style(rc);rc.lineWidth=4;for(let s of KanjiV61.reference[target.value].strokes){rc.beginPath();rc.moveTo(20+s[0][0]*180,20+s[0][1]*180);for(let p of s.slice(1))rc.lineTo(20+p[0]*180,20+p[1]*180);rc.stroke();}}function getPoint(e){let r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*600,y:(e.clientY-r.top)/r.height*600,t:Date.now()};}function down(e){e.preventDefault();canvas.setPointerCapture(e.pointerId);active=[getPoint(e)];draw();}function move(e){if(!active)return;e.preventDefault();let p=getPoint(e),q=active[active.length-1];if(Math.hypot(p.x-q.x,p.y-q.y)>.9){active.push(p);draw();}}function up(e){if(active){if(active.length===1)active.push({...active[0],x:active[0].x+.1});strokes.push(active);active=null;draw();}}canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);document.querySelector('#clear').onclick=()=>{strokes=[];last=null;document.querySelector('#result').textContent='入力待ち';document.querySelector('#score').textContent='—';document.querySelector('#export').disabled=true;draw();};document.querySelector('#undo').onclick=()=>{strokes.pop();last=null;document.querySelector('#export').disabled=true;draw();};target.onchange=()=>{document.querySelector('#clear').click();model();document.querySelector('#advice').textContent='新しい字を書いてください。';};document.querySelector('#judge').onclick=()=>{if(!strokes.length)return;let r=KanjiV61.analyze(target.value,strokes);last={...r,createdAt:new Date().toISOString(),canvas:{width:600,height:600},strokes};let symbols={provisional_ok:'◯ 暫定合格',redo:'✏️ 書き直し',wrong_structure:'❌ 構造違い'};let el=document.querySelector('#result');el.textContent=symbols[r.evaluation.identity];el.className='result '+({provisional_ok:'good',redo:'warn',wrong_structure:'bad'}[r.evaluation.identity]);document.querySelector('#score').textContent=r.balanceAnalysis.overallScore+' / 100';document.querySelector('#advice').textContent=r.advice;document.querySelector('#detail').textContent=JSON.stringify({...r,strokes:undefined},null,2);document.querySelector('#export').disabled=false;};document.querySelector('#export').onclick=()=>{if(!last)return;let blob=new Blob([JSON.stringify(last,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kanji-structure-v6.1-'+last.target+'-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};model();draw();})();
</script></body></html>
