:root{font-family:system-ui,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#1a2834;background:#f5f7fa}body{margin:0}.shell{max-width:850px;margin:32px auto;padding:0 18px}h1{font-size:26px}p{line-height:1.7;color:#4e6171}.wrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}.panel{background:white;border:1px solid #dde4eb;border-radius:16px;padding:16px}#pad{width:100%;background:#fff;display:block;touch-action:none;cursor:crosshair;border:1px solid #bdc9d4;border-radius:12px;aspect-ratio:1}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,select{background:white;border:1px solid #bdc9d4;padding:9px 13px;border-radius:8px;font:inherit}button{cursor:pointer}button.primary{background:#1f5a91;color:white;border-color:#1f5a91}.result{font-size:21px;font-weight:700;margin:10px 0}.muted{font-size:12px;color:#6d7c88}.score{font-size:30px;font-weight:700}pre{overflow:auto;background:#f5f7fa;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap}#model{width:100%;max-width:220px;aspect-ratio:1}.good{color:#18703b}.bad{color:#b32828}.warn{color:#a36311}@media(max-width:650px){.wrap{grid-template-columns:1fr}.shell{margin:15px auto}h1{font-size:22px}}
</style></head><body><main class="shell"><h1>漢字ゲーム β v6.1 <small style="font-size:13px;color:#777">試作版</small></h1><p>必須構造を確認した後に、お手本との画像バランスを採点します。小さな隙間は全体の形が整っていれば許容します。</p><div class="toolbar"><label>出題文字 <select id="kanji"><option>末</option><option>未</option><option>土</option><option>士</option></select></label><button id="undo">1画戻す</button><button id="clear">消す</button><button class="primary" id="judge">採点する</button><button id="export" disabled>診断JSONを保存</button></div><div class="wrap"><section class="panel"><canvas id="pad" width="600" height="600" aria-label="漢字の手書き入力"></canvas><div class="muted">指またはマウスで一画ずつ書いてください。筆順判定は未実装です。</div></section><aside class="panel"><strong>お手本（配置の目安）</strong><canvas id="model" width="220" height="220"></canvas><div id="result" class="result">入力待ち</div><div id="score" class="score">—</div><p id="advice">5画で「末」を書きましょう。</p><details><summary>診断の詳細</summary><pre id="detail">—</pre></details></aside></div><p class="muted">この試作版のしきい値は調整中です。元のv6.0のソースは含んでいないため、互換機能のすべてを再現したものではありません。</p></main><script>
/* Kanji Game v6.1 prototype. Geometry first, then normalized reference balance.
   Scores/thresholds are provisional and need human calibration. */
(function(root){'use strict';
const REF={
 '末':{count:5, strokes:[[[.12,.24],[.88,.24]],[[.27,.45],[.73,.45]],[[.50,.08],[.50,.91]],[[.50,.46],[.15,.88]],[[.50,.46],[.85,.88]]]},
 '未':{count:5, strokes:[[[.26,.24],[.74,.24]],[[.12,.45],[.88,.45]],[[.50,.08],[.50,.91]],[[.50,.46],[.15,.88]],[[.50,.46],[.85,.88]]]},
 '土':{count:3, strokes:[[[.24,.34],[.76,.34]],[[.50,.10],[.50,.84]],[[.12,.83],[.88,.83]]]},
 '士':{count:3, strokes:[[[.12,.31],[.88,.31]],[[.50,.10],[.50,.85]],[[.27,.83],[.73,.83]]]}
};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const rnd=(n)=>Math.round(n*1000)/1000;
const hypot=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function interpolate(poly,n=45){if(poly.length===0)return[];if(poly.length===1)return Array(n).fill(poly[0]);let lens=[],tot=0;for(let i=1;i<poly.length;i++){const d=hypot(poly[i-1],poly[i]);lens.push(d);tot+=d;}if(!tot)return Array(n).fill(poly[0]);let result=[];for(let j=0;j<n;j++){let target=tot*j/(n-1),k=0;while(k<lens.length-1&&target>lens[k])target-=lens[k++];let t=lens[k]?target/lens[k]:0;result.push({x:poly[k].x*(1-t)+poly[k+1].x*t,y:poly[k].y*(1-t)+poly[k+1].y*t});}return result;}
function normalize(strokes){const all=strokes.flat();if(!all.length)return {strokes:[],bounds:null};const minX=Math.min(...all.map(p=>p.x)),maxX=Math.max(...all.map(p=>p.x)),minY=Math.min(...all.map(p=>p.y)),maxY=Math.max(...all.map(p=>p.y));const w=Math.max(maxX-minX,1e-6),h=Math.max(maxY-minY,1e-6),scale=Math.max(w,h),padX=(scale-w)/2,padY=(scale-h)/2;return {strokes:strokes.map(s=>s.map(p=>({x:(p.x-minX+padX)/scale,y:(p.y-minY+padY)/scale}))),bounds:{minX,maxX,minY,maxY,width:w,height:h,scale}};}
function closestPointOnSegment(p,a,b){let dx=b.x-a.x,dy=b.y-a.y,d=dx*dx+dy*dy,t=d?clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/d):0;return {x:a.x+t*dx,y:a.y+t*dy};}
function pointPolylineDist(p,poly){if(!poly.length)return Infinity;let best=hypot(p,poly[0]);for(let i=1;i<poly.length;i++)best=Math.min(best,hypot(p,closestPointOnSegment(p,poly[i-1],poly[i])));return best;}
function polyDist(a,b){if(!a.length||!b.length)return Infinity;return Math.min(...interpolate(a,70).map(p=>pointPolylineDist(p,b)),...interpolate(b,70).map(p=>pointPolylineDist(p,a)));}
function hWidth(s){return Math.max(...s.map(p=>p.x))-Math.min(...s.map(p=>p.x));}
function height(s){return Math.max(...s.map(p=>p.y))-Math.min(...s.map(p=>p.y));}
function center(s){return {x:s.reduce((x,p)=>x+p.x,0)/s.length,y:s.reduce((y,p)=>y+p.y,0)/s.length};}
function direction(s){let a=s[0],b=s[s.length-1];return {dx:b.x-a.x,dy:b.y-a.y};}
function roles(strokes,char){let ar=strokes.map((s,i)=>({s,i,c:center(s),d:direction(s),w:hWidth(s),h:height(s)}));let horizontals=ar.filter(o=>o.w>o.h*1.55).sort((a,b)=>a.c.y-b.c.y);let verticals=ar.filter(o=>o.h>o.w*1.55).sort((a,b)=>b.h-a.h);if(char==='末'||char==='未'){if(horizontals.length<2||verticals.length<1)return null;let upper=horizontals[0],lower=horizontals[1],v=verticals[0],used=new Set([upper.i,lower.i,v.i]);let branches=ar.filter(o=>!used.has(o.i)).sort((a,b)=>a.c.x-b.c.x);return {upper,lower,v,branches,horizontals,verticals};}if(horizontals.length<2||verticals.length<1)return null;return {upper:horizontals[0],lower:horizontals[1],v:verticals[0],branches:[],horizontals,verticals};}
function intersectionAtY(v,y){for(let i=1;i<v.s.length;i++){let a=v.s[i-1],b=v.s[i];if(y>=Math.min(a.y,b.y)&&y<=Math.max(a.y,b.y)){let t=(y-a.y)/(b.y-a.y||1);return {x:a.x+(b.x-a.x)*t,y};}}return {x:v.c.x,y};}
function chamfer(a,b){let p=a.flatMap(s=>interpolate(s,26)),q=b.flatMap(s=>interpolate(s,26));if(!p.length||!q.length)return 0;let da=p.reduce((s,x)=>s+pointPolylineDist(x,q),0)/p.length,db=q.reduce((s,x)=>s+pointPolylineDist(x,p),0)/q.length;return clamp(100*(1-(da+db)/2/.22),0,100);}
function prototypeFit(strokes,char){let model=REF[char].strokes.map(s=>s.map(p=>({x:p[0],y:p[1]})));let n=normalize(strokes).strokes; // normalize both to stroke bounding squares
let base=normalize(model).strokes;let best=0;for(let sx of [.94,1,1.06])for(let sy of [.94,1,1.06]){let adjusted=base.map(s=>s.map(p=>({x:(p.x-.5)*sx+.5,y:(p.y-.5)*sy+.5})));best=Math.max(best,chamfer(n,adjusted));}return rnd(best);}
function analyze(char,strokeInput){let strokes=strokeInput.filter(s=>Array.isArray(s)&&s.length>1).map(s=>s.map(p=>({x:Number(p.x),y:Number(p.y)})).filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)));if(!REF[char])throw Error('対応漢字は末・未・土・士です');const expected=REF[char].count,actual=strokes.length;const n=normalize(strokes), s=n.strokes, r=roles(s,char);let faults=[],advice=[],metrics={},isTree=char==='末'||char==='未';
if(actual!==expected){faults.push({code:'stroke_count',severity:'redo',message:`画数は${expected}画です。現在${actual}画です。`});}
if(!r){faults.push({code:'roles',severity:'wrong_structure',message:'必要な横線・縦線の骨組みが確認できません。'});}else{
let up=r.upper,lo=r.lower,v=r.v;let ratio=lo.w/Math.max(up.w,.001);metrics.lowerToUpperRatio=rnd(ratio);metrics.upperWidth=rnd(up.w);metrics.lowerWidth=rnd(lo.w);
if(((char==='末'||char==='士')&&ratio>=1.015)||((char==='未'||char==='土')&&ratio<=.985))faults.push({code:'contrast',severity:'wrong_structure',message:`「${char}」の上下横線の長短関係が逆です。`});
const upContact=polyDist(up.s,v.s),loContact=polyDist(lo.s,v.s),scaleGap=.035;metrics.upperStemGap=rnd(upContact);metrics.lowerStemGap=rnd(loContact);for(let [key,d] of [['upper_cross',upContact],['lower_cross',loContact]]){if(d>.085)faults.push({code:key,severity:'wrong_structure',message:'横線と中央縦線が大きく離れています。'});else if(d>scaleGap)faults.push({code:key,severity:'redo',message:'横線と中央縦線のつながりを確認しましょう。'});}
const vymin=Math.min(...v.s.map(p=>p.y)),vymax=Math.max(...v.s.map(p=>p.y));let upY=up.c.y,loY=lo.c.y;metrics.stemTopExtension=rnd(upY-vymin);
if(vymin>upY-.025)faults.push({code:'stem_top',severity:'wrong_structure',message:'中央縦線を上横線より上から通しましょう。'});
if(isTree){if(r.branches.length!==2)faults.push({code:'branches',severity:'wrong_structure',message:'左右の払いが2画あるか確認しましょう。'});else{let p=intersectionAtY(v,loY);let lowStarts=[];let branchD=[];for(let b of r.branches){let start=b.s[0],end=b.s[b.s.length-1];let nearStart=pointPolylineDist(start,v.s),relativeY=start.y-loY;branchD.push(nearStart);lowStarts.push(relativeY);if(Math.abs(end.x-start.x)<.065||end.y<start.y+.07)faults.push({code:'branch_direction',severity:'redo',message:'払いを左右の斜め下方向に広げましょう。'});if(nearStart>.095)faults.push({code:'branch_gap',severity:'wrong_structure',message:'払いが中央縦線から大きく離れています。'});else if(nearStart>.05)faults.push({code:'branch_gap',severity:'redo',message:'払いの始点を中央線にもう少し近づけましょう。'});if(relativeY>.30||relativeY<-.17)faults.push({code:'branch_height',severity:'wrong_structure',message:'払いを下横線と中央縦線の交点付近から書き始めましょう。'});else if(relativeY>.135||relativeY<-.10)faults.push({code:'branch_height',severity:'redo',message:'払いを下の横線と縦線の交点付近から書き始めましょう。'});}metrics.branchStartOffsets=lowStarts.map(rnd);metrics.branchStemGaps=branchD.map(rnd);metrics.stemBeyondBranches=rnd(vymax-Math.max(...r.branches.map(b=>b.s[0].y)));if(vymax<Math.max(...r.branches.map(b=>b.s[0].y))+.035)faults.push({code:'stem_extension',severity:'wrong_structure',message:'中央縦線を払いの分岐位置より下に伸ばしましょう。'});}
}else{if(vymax<loY-.02)faults.push({code:'stem_bottom',severity:'redo',message:'中央縦線と下横線の長さを確認しましょう。'});}}
let similarity=prototypeFit(strokes,char);metrics.imageSimilarity=similarity;
// Image similarity alone is not handwriting probability; scores represent reference layout fit.
// Gating: mandatory geometry cannot be overridden by a visually similar outline.
let hard=faults.some(f=>f.severity==='wrong_structure'),soft=faults.some(f=>f.severity==='redo');let balanceStatus=similarity>=72?'provisional_ok':similarity>=48?'redo':'wrong_structure';let identity=hard?'wrong_structure':soft?'redo':balanceStatus;
let suggested=identity==='provisional_ok'?'字形と全体のバランスは良好です。':faults.length?faults[0].message:'お手本と比べて全体の配置・形を整えましょう。';
return {schema:'kanji-structure-v6.1-prototype',target:char,strokes:actual,structuralResult:{kind:identity==='provisional_ok'?'ok':identity==='redo'?'retry':'wrong',identity,checks:faults.map(f=>f.message),metrics},balanceAnalysis:{status:'measured',method:'normalized_bidirectional_chamfer_plus_geometry_v1',reference:`${char}-vector-prototype`,imageSimilarity:similarity,overallScore:similarity,thresholds:{ok:72,redo:48},note:'点数は暫定的なお手本への形状近似度であり、正解確率ではありません。'},evaluation:{identity,shape:{status:identity==='provisional_ok'?'compatible':identity==='redo'?'needs_improvement':'incompatible',reason:suggested},count:{status:expected===actual?'ok':'mismatch',expected,actual},order:{status:'not_checked',message:'書き順は未検証です。'}},learningPractice:{status:identity==='provisional_ok'?'none':'offer',current:{status:identity==='provisional_ok'?'clear':'needs_practice',reason:suggested}},strokeOrder:{status:'not_checked'},advice:suggested,issues:faults};}
root.KanjiV61={analyze,normalize,reference:REF,prototypeFit,chamfer};
if(typeof module!=='undefined'&&module.exports)module.exports=root.KanjiV61;
})(typeof window!=='undefined'?window:globalThis);

</script><script>
(()=>{'use strict';const canvas=document.querySelector('#pad'),ctx=canvas.getContext('2d'),refCanvas=document.querySelector('#model'),rc=refCanvas.getContext('2d');let strokes=[],active=null,last=null;let target=document.querySelector('#kanji');function style(c){c.lineCap='round';c.lineJoin='round';c.strokeStyle='#183d61';c.lineWidth=5;}function draw(){ctx.clearRect(0,0,600,600);ctx.strokeStyle='#ecf0f4';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(300,0);ctx.lineTo(300,600);ctx.moveTo(0,300);ctx.lineTo(600,300);ctx.stroke();style(ctx);for(let st of [...strokes,...(active?[active]:[])]){if(!st.length)continue;ctx.beginPath();ctx.moveTo(st[0].x,st[0].y);for(let i=1;i<st.length;i++)ctx.lineTo(st[i].x,st[i].y);ctx.stroke();}}function model(){rc.clearRect(0,0,220,220);rc.strokeStyle='#e5e7eb';rc.lineWidth=1;rc.strokeRect(20,20,180,180);style(rc);rc.lineWidth=4;for(let s of KanjiV61.reference[target.value].strokes){rc.beginPath();rc.moveTo(20+s[0][0]*180,20+s[0][1]*180);for(let p of s.slice(1))rc.lineTo(20+p[0]*180,20+p[1]*180);rc.stroke();}}function getPoint(e){let r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*600,y:(e.clientY-r.top)/r.height*600,t:Date.now()};}function down(e){e.preventDefault();canvas.setPointerCapture(e.pointerId);active=[getPoint(e)];draw();}function move(e){if(!active)return;e.preventDefault();let p=getPoint(e),q=active[active.length-1];if(Math.hypot(p.x-q.x,p.y-q.y)>.9){active.push(p);draw();}}function up(e){if(active){if(active.length===1)active.push({...active[0],x:active[0].x+.1});strokes.push(active);active=null;draw();}}canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);document.querySelector('#clear').onclick=()=>{strokes=[];last=null;document.querySelector('#result').textContent='入力待ち';document.querySelector('#score').textContent='—';document.querySelector('#export').disabled=true;draw();};document.querySelector('#undo').onclick=()=>{strokes.pop();last=null;document.querySelector('#export').disabled=true;draw();};target.onchange=()=>{document.querySelector('#clear').click();model();document.querySelector('#advice').textContent='新しい字を書いてください。';};document.querySelector('#judge').onclick=()=>{if(!strokes.length)return;let r=KanjiV61.analyze(target.value,strokes);last={...r,createdAt:new Date().toISOString(),canvas:{width:600,height:600},strokes};let symbols={provisional_ok:'◯ 暫定合格',redo:'✏️ 書き直し',wrong_structure:'❌ 構造違い'};let el=document.querySelector('#result');el.textContent=symbols[r.evaluation.identity];el.className='result '+({provisional_ok:'good',redo:'warn',wrong_structure:'bad'}[r.evaluation.identity]);document.querySelector('#score').textContent=r.balanceAnalysis.overallScore+' / 100';document.querySelector('#advice').textContent=r.advice;document.querySelector('#detail').textContent=JSON.stringify({...r,strokes:undefined},null,2);document.querySelector('#export').disabled=false;};document.querySelector('#export').onclick=()=>{if(!last)return;let blob=new Blob([JSON.stringify(last,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kanji-structure-v6.1-'+last.target+'-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};model();draw();})();
</script></body></html>
